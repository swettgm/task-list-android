function switchGroup(next){if(pageSlide)finishPageSlide(false,false);if(closeDialog||!state||next===group)return;group=next;render();scrollTo(0,0);haptic();}for(const g of ['people','dating']){$(g+'-tab').onclick=()=>switchGroup(g);$(g+'-tab').onkeydown=e=>{if(['ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();$(g==='people'?'dating-tab':'people-tab').click();$(group+'-tab').focus();}};}let pageSlide=null,swipe=null,suppressClickUntil=0;
function finishPageSlide(commit,animate=true){const d=pageSlide;if(!d)return;d.finishing=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const complete=()=>{if(pageSlide!==d)return;pageSlide=null;d.animations?.forEach(a=>a.cancel());d.incoming.style.transform='';d.incoming.inert=false;d.outgoing.remove();d.stack.style.minHeight='';if(commit){group=d.target;render();scrollTo(0,0);haptic();}else{d.incoming.replaceChildren(...d.originalNodes);alignContextArrows();}};if(!animate||reduced||!d.incoming.animate){complete();return;}const options={duration:Math.max(160,240*(commit?1-d.ratio:d.ratio)),easing:'cubic-bezier(.22,.61,.36,1)',fill:'both'};d.animations=[d.incoming.animate([{transform:'translateX('+(d.direction*(1-d.ratio)*100)+'%)'},{transform:'translateX('+(commit?0:d.direction*100)+'%)'}],options),d.outgoing.animate([{transform:'translateX('+(-d.direction*d.ratio*100)+'%)'},{transform:'translateX('+(commit?-d.direction*100:0)+'%)'}],options)];Promise.all(d.animations.map(a=>a.finished)).then(complete,complete);}
function movePageSwipe(dx){const from=swipe.from,direction=from==='people'?1:-1;if(!pageSlide&&-direction*dx>0){const stack=$('page-stack'),incoming=$('list'),outgoing=el('div','swipe-outgoing'),originalNodes=[...incoming.childNodes],target=from==='people'?'dating':'people',height=incoming.getBoundingClientRect().height;outgoing.setAttribute('aria-hidden','true');outgoing.inert=true;outgoing.append(...originalNodes);stack.append(outgoing);group=target;render();group=from;for(const g of ['people','dating'])$(g+'-tab').setAttribute('aria-selected',String(g===from));incoming.inert=true;stack.style.minHeight=Math.max(height,incoming.getBoundingClientRect().height)+'px';pageSlide={from,target,direction,width:stack.getBoundingClientRect().width,stack,incoming,outgoing,originalNodes,ratio:0};}if(pageSlide&&!pageSlide.finishing){const d=pageSlide;d.ratio=Math.max(0,Math.min(1,-d.direction*dx/d.width));d.incoming.style.transform='translateX('+(d.direction*(1-d.ratio)*100)+'%)';d.outgoing.style.transform='translateX('+(-d.direction*d.ratio*100)+'%)';}}
document.addEventListener('pointerdown',event=>{if(pageSlide)finishPageSlide(false,false);if(closeDialog||!state||event.isPrimary===false||event.button!==0||event.target.closest('button:not(.person-title):not(.inline-edit):not(.person-status):not([data-tag]),input,textarea,select,a,summary,dialog'))return;swipe={id:event.pointerId,x:event.clientX,y:event.clientY,horizontal:false,from:group};});
