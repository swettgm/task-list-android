<script>
(()=>{'use strict';const native=window.CrmNative,$=id=>document.getElementById(id);let state,group='people',closeDialog=null,editorOpen=false,loading=false,toastTimer;const clone=value=>JSON.parse(JSON.stringify(value));const paths={gear:'M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0-16',plus:'M12 4v16M4 12h16',contacts:'M8 4a4 4 0 1 0 0 8a4 4 0 0 0 0-8M2 21v-3c0-5 12-5 12 0v3M19 8v8m-4-4h8'};function icon(name){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('viewBox','0 0 24 24');s.setAttribute('aria-hidden','true');const p=document.createElementNS(s.namespaceURI,'path');p.setAttribute('d',paths[name]);s.append(p);return s;}function el(tag,cls='',text){const e=document.createElement(tag);e.className=cls;if(text!==undefined)e.textContent=text;return e;}function btn(text,run,cls=''){const b=el('button',cls,text);b.type='button';b.onclick=run;return b;}function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,3500);}function haptic(){native?.haptic();}function read(){const raw=native?native.readState():localStorage.getItem('crm');if(raw===null&&native)throw Error('Storage unreadable');const result=raw?JSON.parse(raw):{version:1,people:[],appearance:{top:'#203747',bottom:'#5a5c61',text:'#f4f7fa'}};if(result.version!==1||!Array.isArray(result.people)||!result.appearance)throw Error('Invalid data');for(const p of result.people){p.stage=({Interested:'In progress',Dating:'In progress',Paused:'Hiatus'})[p.stage]||p.stage;p.tags=Array.isArray(p.tags)?p.tags:[];}return result;}function apply(){for(const k of ['top','bottom','text'])document.documentElement.style.setProperty('--'+k,state.appearance[k]);native?.setThemeColors(state.appearance.top,state.appearance.bottom);}function write(change,error){try{const next=clone(read());change(next);if(native){if(!native.writeSta function markContacted(id){if(native){if(!native.contacted(id)){toast('Couldn’t save contact date.');return;}state=read();render();}else write(next=>{const p=next.people.find(p=>p.id===id);p.lastAt=Date.now();const at=new Date();const old=new Date(p.nextAt);at.setHours(old.getHours(),old.getMinutes(),0,0);p.nextAt=advance(at.getTime(),p.every,p.unit);});haptic();toast('Contact date saved');}
function modal(title,onClose){if(closeDialog)closeDialog();const dialog=el('dialog'),h=el('h2','',title),form=el('form'),fields=el('div','fields'),error=el('p','error'),actions=el('div','actions');error.setAttribute('role','alert');form.append(fields,error,actions);dialog.append(h,form);document.body.append(dialog);native?.setModalOpen(true);const close=()=>{if(!dialog.isConnected)return;closeDialog=null;editorOpen=false;dialog.close();dialog.remove();native?.setModalOpen(false);onClose?.();};closeDialog=close;form.onsubmit=e=>e.preventDefault();dialog.addEventListener('cancel',e=>{e.preventDefault();close();});dialog.showModal();return{dialog,fields,actions,error,close,form};}function field(parent,label,type,value){const wrap=el('label','field'),input=el(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;else input.rows=1;input.value=value??'';input.setAttribute('aria-label',label);wrap.append(el('span','',label),input);parent.append(wrap);return input;}function select(parent,label,options,value){const wrap=el('label','field'),input=el('select');input.setAttribute('aria-label',label);for(const [v,t]of options){const o=el('option','',t);o.value=v;input.append(o);}input.value=value;wrap.append(el('span','',label),input);parent.append(wrap);return input;}function checkbox(parent,label,value){const wrap=el('label','check'),input=el('input');input.type='checkbox';input.checked=value;wrap.append(input,el('span','',label));parent.append(wrap);return input;}function autoGrow(text){const fit=()=>{text.style.height='auto';text.style.height=Math.max(48,text.scrollHeight+3)+'px';};text.addEventListener('input',fit);requestAnimationFrame(fit);}
function openPerson(id){if(!state)return;const found=state.people.find(p=>p.id===id);if(id&&!found){toast('This person is no longer saved.');return;}const p=clone(found||newPerson());group=p.group;render();const m=modal(found?'Edit person':'Add person');editorOpen=true;const {fields,actions,error,close}=m;const name=field(fields,'Name','text',p.name);name.maxLength=200;const stage=p.group==='dating'?select(fields,'Status',[['In progress','In progress'],['Hiatus','Hiatus'],['DTF','DTF']],p.stage):null;const phone=field(fields,'Phone','tel',p.phone);phone.maxLength=500;fields.append(el('span','tags-label','Tags'));const tagOptions=el('div','tags-picker'),selectedTags=new Set(p.tags||[]);for(const tag of ['Snapchat','Discord','In person']){const toggle=btn(tag,()=>{selectedTags.has(tag)?selectedTags.delete(tag):selectedTags.add(tag);toggle.setAttribute('aria-pressed',String(selectedTags.has(tag)));});toggle.setAttribute('aria-pressed',String(selectedTags.has(tag)));tagOptions.append(toggle);}fields.append(tagOptions);if(p.lookupKey){name.readOnly=phone.readOnly=true;fields.append(el('p','muted small','Linked to phone contacts. Unlink to edit contact details here.'));const unlink=btn('Unlink contact',()=>{p.lookupKey='';p.contactId='';name.readOnly=phone.readOnly=false;unlink.disabled=true;unlink.textContent='Contact unlinked';});fields.append(unlink);}const notes=field(fields,'Notes','textarea',p.notes);notes.maxLength=20000;autoGrow(notes);const enabled=checkbox(fields,'Reach-out reminders',p.reminders),schedule=el('div');fields.append(schedule);const cadence=el('div','schedule-grid');schedule.append(cadence);const every=field(cadence,'Every','number',p.every);every.min=1;every.max=365;every.step=1;const unit=select(cadence,'Repeat',[['days','Days'],['weeks','Weeks'],['months','Months']],p.unit);const when=el('div','schedule-grid');schedule.append(when);const date=field(when,'Next reminder','date',calendarValue(p.nextAt)),time=field(when,'Time','time',timeValue(p.nextAt));schedule.append(el('p','muted small','Reminders repeat until you change or turn them off. Contacted today resets the schedule.'));enabled.onchange=()=>schedule.hidden=!enabled.checked;enabled.onchange();if(p.lastAt)fields.append(el('p','muted small','Last contacted '+dateText(p.lastAt)));if(found){let confirming=false;const remove=btn('',()=>{if(!confirming){confirming=true;remove.setAttribute('aria-label','Confirm delete person');remove.setAttribute('aria-pressed','true');error.textContent='Tap the trash can again to delete this person.';return;}if(write(next=>{next.people=next.people.filter(v=>v.id!==p.id);},error))close();},'danger delete-person');remove.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg>';remove.setAttribute('aria-label','Delete person');remove.title='Delete person';actions.append(remove);}actions.append(btn('Cancel',close),btn('Save',()=>{error.textContent='';if(!name.value.trim()){error.textContent='Enter a name.';name.focus();return;}const count=Number(every.value),nextAt=new Date(date.value+'T'+time.value).getTime();if(enabled.checked&&(!Number.isInteger(count)||count<1||count>365||!Number.isFinite(nextAt)||nextAt<=Date.now())){error.textContent='Choose a future reminder and a whole repeat interval from 1 to 365.';return;}Object.assign(p,{name:name.value.trim(),phone:phone.value.trim(),tags:[...selectedTags],notes:notes.value.trim(),stage:stage?stage.value:p.stage,reminders:enabled.checked,every:Number.isInteger(count)&&count>=1&&count<=365?count:1,unit:unit.value,nextAt:Number.isFinite(nextAt)?nextAt:0});if(write(next=>{const i=next.people.findIndex(v=>v.id===p.id);if(found&&i<0)throw Error('This person was removed. Close and reopen.');if(i<0)next.people.push(p);else next.people[i]=p;},error)){group=p.group;close();render();haptic();if(p.reminders&&native&&!native.notificationsAllowed())native.requestNotifications();}},'primary'));}
function importContacts(){if(!native){toast('Phone contacts are available in the Android app.');return;}if(!native.contactsAllowed()){native.requestContacts();return;}const raw=native.contacts();if(raw===null){toast('Couldn’t read contacts. Check the contact permission.');return;}let contacts;try{contacts=JSON.parse(raw);}catch(_){toast('Couldn’t read contacts.');return;}const m=modal('Add from contacts'),search=field(m.fields,'Find a contact','search',''),list=el('div'),selected=new Map();m.fields.append(list);const add=btn('Add contacts',()=>{if(write(next=>{for(const item of selected.values()){if(next.people.some(p=>p.lookupKey===item.lookupKey&&p.lookupKey))continue;const details=JSON.parse(native.contact(item.lookupKey,item.contactId)||'null');if(!details)throw Error('A contact changed. Reopen the contact list and try again.');next.people.push(Object.assign(newPerson(),details,{reminders:false}));}},m.error)){m.close();toast('Contacts added');haptic();}},'primary');const draw=()=>{const term=search.value.toLocaleLowerCase();list.replaceChildren();for(const c of contacts.filter(c=>c.name.toLocaleLowerCase().includes(term))){const saved=state.people.find(p=>p.lookupKey===c.lookupKey&&p.lookupKey),row=el('label','check contact-option'),check=el('input'),text=el('span','',c.name);check.type='checkbox';check.checked=saved||selected.has(c.lookupKey);check.disabled=!!saved;check.setAttribute('aria-label',c.name);if(saved)text.append(el('span','muted','Already added · '+(saved.group==='dating'?'Dating':'Friends')));check.onchange=()=>{check.checked?selected.set(c.lookupKey,c):selected.delete(c.lookupKey);add.disabled=!selected.size;};row.append(check,text);list.append(row);}if(!contacts.length)list.append(el('p','empty','No contacts found. You can add people manually.'));};search.oninput=draw;add.disabled=true;m.actions.append(btn('Cancel',m.close),add);draw();}
