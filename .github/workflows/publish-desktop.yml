name: Publish verified Tasks Windows download

on:
  push:
    paths:
      - 'release/windows.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Validate the requested build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/publish_windows.py validate
      - name: Download tested installer
        uses: actions/download-artifact@v4
        with:
          name: Tasks-Windows-Installer
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: publish-input/setup
      - name: Download tested native companion
        uses: actions/download-artifact@v4
        with:
          name: Tasks-PC-Windows
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ github.token }}
          path: publish-input/desktop
      - name: Verify and prepare downloads
        run: python .github/scripts/publish_windows.py prepare
      - name: Publish without overwriting concurrent changes
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified native Tasks Windows downloads'
          git push origin HEAD:main
