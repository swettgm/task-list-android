name: Build Route Manager
run-name: Build Route Manager · attempt ${{ github.run_number }}
on:
  workflow_dispatch:
  push:
    paths:
      - 'route-manager/**'
      - '.github/workflows/build-route-manager.yml'
permissions:
  contents: read
jobs:
  build:
    name: Build and check Route Manager
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: route-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-4.14.1-android-runtimes-v1
      - name: Prepare Android SDK and ephemeral CI signer
        shell: bash
        run: |
          set -euo pipefail
          ROUTE_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$ROUTE_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$ROUTE_SDK_DIR" > local.properties
          export ROUTE_DEBUG_KEYSTORE="$RUNNER_TEMP/route-manager-ci.keystore"
          printf 'ROUTE_DEBUG_KEYSTORE=%s\n' "$ROUTE_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$ROUTE_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Route Manager CI,O=Personal,C=US'
      - name: Build, unit tests and lint
        run: gradle --no-daemon --console=plain :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Browser workflow checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          node tools/browser-smoke.mjs
      - name: Verify CI APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk
          sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Route-Manager-Android-APK
          path: route-manager/app/build/outputs/apk/debug/*.apk*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Route-Manager-Test-Reports
          path: |
            route-manager/app/build/reports/tests/
            route-manager/app/build/test-results/
            route-manager/app/build/reports/lint-results-debug.*
            route-manager/build/browser-qa/
          retention-days: 14
