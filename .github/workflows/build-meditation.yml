name: Build Meditation
run-name: Build Meditation · attempt ${{ github.run_number }}
on:
  workflow_dispatch:
  push:
    paths:
      - 'meditation/**'
      - '.github/workflows/build-meditation.yml'
permissions:
  contents: read
jobs:
  build:
    name: Build and check Meditation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: meditation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric/android-all-instrumented
          key: robolectric-4.14.1-android-runtimes-v1
      - name: Prepare Android SDK and ephemeral CI signer
        shell: bash
        run: |
          set -euo pipefail
          MEDITATION_SDK_DIR="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          "$MEDITATION_SDK_DIR/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
          printf 'sdk.dir=%s\n' "$MEDITATION_SDK_DIR" > local.properties
          export MEDITATION_DEBUG_KEYSTORE="$RUNNER_TEMP/meditation-ci.keystore"
          printf 'MEDITATION_DEBUG_KEYSTORE=%s\n' "$MEDITATION_DEBUG_KEYSTORE" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$MEDITATION_DEBUG_KEYSTORE" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=Meditation CI,O=Personal,C=US'
      - name: Install audio verification tools
        timeout-minutes: 5
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            ffmpeg -version
          else
            python3 -m pip install --disable-pip-version-check imageio-ffmpeg==0.6.0
            python3 - <<'PYTHON'
          import imageio_ffmpeg, os, pathlib, shutil
          folder = pathlib.Path(os.environ['RUNNER_TEMP']) / 'meditation-audio'
          folder.mkdir(exist_ok=True)
          binary = folder / 'ffmpeg'
          shutil.copy2(imageio_ffmpeg.get_ffmpeg_exe(), binary)
          binary.chmod(0o755)
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(folder) + '\n')
          PYTHON
          fi
      - name: Verify extended audio files
        run: |
          python3 tools/audio-check.py
          python3 tools/ambient-check.py
      - name: Build, unit tests and lint
        run: gradle --no-daemon --console=plain :app:assembleRelease :app:testDebugUnitTest :app:lintRelease
      - name: Browser workflow checks
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          node tools/browser-smoke.mjs
      - name: Verify CI APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk > app/build/outputs/apk/release/app-release.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Meditation-Android-APK
          path: meditation/app/build/outputs/apk/release/*.apk*
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Meditation-Test-Reports
          path: |
            meditation/app/build/reports/tests/
            meditation/app/build/test-results/
            meditation/app/build/reports/lint-results-release.*
            meditation/build/browser-qa/
            meditation/build/audio-qa/
          retention-days: 14
