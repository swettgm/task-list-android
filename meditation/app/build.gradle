plugins { id 'com.android.application' }
android {
    namespace 'com.personal.meditation'
    compileSdk 35
    buildToolsVersion '35.0.0'
    androidResources { noCompress += ['flac'] }
    defaultConfig { applicationId 'com.personal.meditation'; minSdk 26; targetSdk 35; versionCode 23; versionName '1.0.22' }
    signingConfigs { debug { def keyStorePath=System.getenv('MEDITATION_DEBUG_KEYSTORE'); if(keyStorePath) storeFile file(keyStorePath) } }
    signingConfigs { debug { def keyStorePath=System.getenv('MEDITATION_DEBUG_KEYSTORE'); if(keyStorePath) storeFile file(keyStorePath) } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    testOptions { unitTests { includeAndroidResources = true; all { systemProperty 'robolectric.dependency.repo.url','https://repo.maven.apache.org/maven2' } } }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.robolectric:robolectric:4.14.1' }
