function renderSwatches(){for(const key of Object.keys(names)){const button=document.querySelector('[data-color="'+key+'"]');button.querySelector('.color-swatch').style.background=draft[key];button.querySelector('code').textContent=draft[key].toUpperCase();button.hidden=key.startsWith('background')&&draft.imageBackground?true:key==='backgroundBottom'?!draft.backgroundGradient:key==='accentBottom'?!draft.accentGradient:false;}$('background-image-row').hidden=!draft.imageBackground;$('background-image-name').textContent=imageInfo.backgroundImageName||'Choose an image';$('remove-background').hidden=!imageInfo.backgroundImageAvailable;const background=$('background-mode').value==='gradient',accent=$('accent-mode').value==='gradient';document.querySelector('[data-color="backgroundTop"] .color-name').textContent=background?'First color':'Color';document.querySelector('[data-color="accentTop"] .color-name').textContent=accent?'First color':'Color';}

function draw(){const size=canvas.width,center=size/2,radius=center-8,data=context.createImageData(size,size);for(let y=0;y<size;y++)for(let x=0;x<size;x++){const dx=x-center,dy=y-center,distance=Math.hypot(dx,dy);if(distance>radius)continue;const hue=(Math.atan2(dy,dx)*180/Math.PI+360)%360,color=rgb(hue,distance/radius,hsv[2]),index=(y*size+x)*4;data.data.set([...color,Math.round(255*Math.min(1,radius-distance))],index);}context.putImageData(data,0,0);const radians=hsv[0]*Math.PI/180,x=center+Math.cos(radians)*hsv[1]*radius,y=center+Math.sin(radians)*hsv[1]*radius;context.beginPath();context.arc(x,y,6,0,2*Math.PI);context.lineWidth=4;context.strokeStyle='#182b38';context.stroke();context.lineWidth=2;context.strokeStyle='#ffffff';context.stroke();const color=hex(rgb(...hsv));$('color-hex').value=color.toUpperCase();$('color-brightness').value=Math.round(hsv[2]*100);$('brightness-value').textContent=Math.round(hsv[2]*100)+'%';$('color-preview').style.background=color;canvas.setAttribute('aria-valuenow',Math.round(hsv[0])%360);canvas.setAttribute('aria-valuetext',color.toUpperCase());$('color-error').textContent='';}
function close(){if(!dialog.open)return false;dialog.close();const button=picking?document.querySelector('[data-color="'+picking+'"]'):null;picking=null;button?.focus({preventScroll:true});return true;}

$('color-brightness').addEventListener('input',()=>{hsv[2]=Number($('color-brightness').value)/100;draw();});$('color-hex').addEventListener('input',()=>{if(valid($('color-hex').value)){hsv=fromHex($('color-hex').value);draw();}});$('color-cancel').addEventListener('click',close);dialog.addEventListener('cancel',event=>{event.preventDefault();close();});$('color-save').addEventListener('click',()=>{const value=$('color-hex').value;if(!valid(value)){$('color-error').textContent='Enter a six-digit hex color, such as #203747.';return;}const previous=draft[picking];draft[picking]=value.toLowerCase();if(commit()){renderSwatches();apply(draft);close();}else{draft[picking]=previous;$('color-error').textContent='Couldn’t save this color. Try again.';}});

(()=>{'use strict';const native=window.MeditationNative,appearance=window.MeditationAppearance,$=id=>document.getElementById(id);let config=null,lastPhase='',saving=false,poll,pendingSave,timerMode=null,timerTransition=null;const definitions=[['prepShort','First two countdown pulses',.9],['prepLong','Final countdown pulse',.9],['start','Meditation start',5],['quarter','Interval cues',5],['end','Meditation end',5]],sounds=[['soft_bell','Mindfulness bell'],['warm_bowl','Singing bowl'],['gentle_chime','Tingsha bells'],['temple_gong','Temple gong'],['zen_tone','Zen tone'],['silent','Silent']];
function format(ms){const seconds=Math.max(0,Math.ceil(ms/1000));return Math.floor(seconds/60).toString().padStart(2,'0')+':'+(seconds%60).toString().padStart(2,'0');}
function clearTimerFade(){if(!timerTransition)return;timerTransition.incoming.cancel();timerTransition.outgoing.cancel();timerTransition.previous.remove();timerTransition=null;}

function error(message){$('error').textContent=message||'';}
function readForm(){const next=JSON.parse(JSON.stringify(config)),minutes=Number($('minutes').value);if(!Number.isInteger(minutes)||minutes<1||minutes>240)throw Error('Choose a duration from 1 to 240 minutes.');next.minutes=minutes;const countdown=Number($('countdown').value);if(!Number.isInteger(countdown)||countdown<0||countdown>300)throw Error('Choose a countdown from 0 to 300 seconds.');next.countdownSeconds=countdown;const intervals=Number($('intervals').value)+1;if(!Number.isInteger(intervals)||intervals<1||intervals>6)throw Error('Choose 0 to 5 intermediate bells.');next.intervals=intervals;for(const role of ['bell','quarter','ambient'])next[role]=$(role+'-sound').value;next.ambientVolume=Number($('ambient-volume').value);if(!Number.isInteger(next.ambientVolume)||next.ambientVolume<0||next.ambientVolume>100)throw Error('Choose a background volume from 0 to 100.');for(const[key,label,max]of definitions){const ms=Math.round(Number($(key+'-seconds').value)*1000);if(!Number.isFinite(ms)||ms<50||ms>max*1000)throw Error(label+': choose 0.05 to '+max+' seconds.');next.vibrations[key]={enabled:$(key+'-enabled').checked,ms};}next.appearance=appearance.read();return next;}
function save(){clearTimeout(pendingSave);if(saving||!config)return false;try{const next=readForm();if(native.save(JSON.stringify(next))!==true)throw Error('Couldn’t save. Please try again.');config=next;appearance.apply(config.appearance);error('');summary();return true;}catch(e){error(e.message);return false;}}
function intervalWords(milliseconds){const seconds=Math.round(milliseconds/1000),minutes=Math.floor(seconds/60),remainder=seconds%60;return[minutes?minutes+' '+(minutes===1?'minute':'minutes'):'',remainder?remainder+' '+(remainder===1?'second':'seconds'):''].filter(Boolean).join(' ')||'0 seconds';}
function summary(){updateBellLabels();updateAmbient();const minutes=Number($('minutes').value),bells=Number($('intervals').value);$('bell-count-value').textContent=bells===0?'Off':bells+' '+(bells===1?'bell':'bells');$('quarter-summary').textContent=Number.isInteger(minutes)&&minutes>0?(bells===0?'Interval bells off':'One bell every '+intervalWords(minutes*60000/(bells+1))):'';if(lastPhase==='idle'||lastPhase==='finished')showTime(format(minutes*60000),'idle');}
function updateAmbient(){const off=$('ambient-sound')?.value==='off';$('ambient-volume').disabled=off;$('ambient-volume-value').textContent=$('ambient-volume').value+'%';const preview=$('ambient-sound')?.closest('.sound-row').querySelector('.preview');if(preview)preview.disabled=off;}
function updateBellLabels(){const off=Number($('intervals').value)===0;if($('quarter-sound'))$('quarter-sound').disabled=off;const preview=$('quarter-sound')?.closest('.sound-row').querySelector('.preview');if(preview)preview.disabled=off;if($('quarter-enabled'))$('quarter-enabled').disabled=off;if($('quarter-seconds'))$('quarter-seconds').disabled=off||!$('quarter-enabled').checked;}
function renderSetup(){saving=true;appearance.render(config.appearance,config);$('minutes').value=config.minutes;$('countdown').value=String(config.countdownSeconds??30);$('intervals').value=String((config.intervals||4)-1);$('sounds').replaceChildren();for(const[role,label]of [['bell','Start & end bell'],['quarter','Interval bell'],['ambient','Background sound']]){const row=document.createElement('div');row.className='sound-row';const wrap=document.createElement('div');wrap.className='field';const caption=document.createElement('label');caption.className='caption';caption.textContent=label;caption.id=role+'-caption';const select=document.createElement('select');select.id=role+'-sound';caption.htmlFor=select.id;select.setAttribute('aria-label',label);const list=role==='ambient'?[['off','Off'],['brown_noise','Brown noise'],['white_noise','White noise'],['rain','Rain']]:[...sounds];if(config[role+'HasCustom'])list.push(['custom',config[role+'Name']||'Chosen audio file']);list.push(['pick','Choose audio file…']);for(const[value,name]of list){const option=document.createElement('option');option.value=value;option.textContent=name;select.append(option);}select.value=config[role]||(role==='ambient'?'off':'soft_bell');select.addEventListener('change',()=>{if(select.value==='pick'){select.value=config[role]||(role==='ambient'?'off':'soft_bell');native.chooseSound(role);}else save();});const preview=document.createElement('button');preview.className='preview';preview.setAttribute('aria-label','Preview '+label.toLowerCase());preview.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5L19 12L8 19Z"/></svg>';preview.addEventListener('click',()=>{if(save())native.preview(role);});const controls=document.createElement('div');controls.className='sound-controls';controls.append(select,preview);wrap.append(caption,controls);row.append(wrap);$('sounds').append(row);}
$('ambient-volume').value=String(config.ambientVolume??25);updateAmbient();$('vibrations').replaceChildren();for(const[key,label,max]of definitions){const row=document.createElement('div');row.className='vibration-row';const wrap=document.createElement('label'),check=document.createElement('input');check.type='checkbox';check.id=key+'-enabled';check.checked=config.vibrations[key].enabled;check.setAttribute('aria-label',label+' vibration');const text=document.createElement('span');text.id=key+'-label';text.textContent=label;wrap.append(check,text);const control=document.createElement('div');control.className='vibration-length';const seconds=document.createElement('input');seconds.type='range';seconds.id=key+'-seconds';seconds.min='.05';seconds.max=String(max);seconds.step='.05';seconds.value=String(Math.round(config.vibrations[key].ms/50)*.05);seconds.disabled=!check.checked;seconds.setAttribute('aria-label',label+' vibration seconds');const output=document.createElement('output');output.htmlFor=seconds.id;output.id=key+'-value';const display=()=>{output.textContent=Number(seconds.value).toFixed(2)+' s';seconds.setAttribute('aria-valuetext',Number(seconds.value).toFixed(2)+' seconds');};display();check.addEventListener('change',()=>{seconds.disabled=!check.checked;save();});seconds.addEventListener('input',()=>{display();clearTimeout(pendingSave);pendingSave=setTimeout(save,120);});seconds.addEventListener('change',()=>{display();if(save()&&!seconds.disabled)native.previewVibration(key);});control.append(seconds,output);row.append(wrap,control);$('vibrations').append(row);}saving=false;summary();}
function update(){clearTimeout(poll);try{const value=JSON.parse(native.state()),phase=value.phase||'idle',active=['preparing','meditating','paused'].includes(phase);lastPhase=phase;$('setup').disabled=active;$('timer').hidden=false;$('start').hidden=active;$('pause').hidden=!active;$('end').hidden=!active;$('pause').textContent=phase==='paused'?'Resume':'Pause';$('start').textContent='Start';if(active)showTime(format(value.remainingMs||0),phase==='paused'?(value.period||timerMode):phase);else summary();if(!document.hidden){const running=phase==='preparing'||phase==='meditating';poll=setTimeout(update,running?Math.max(4,(Number(value.remainingMs)%1000)||1000)+2:1000);}}catch(_){error('Couldn’t read the timer. Close and reopen the app.');if(!document.hidden)poll=setTimeout(update,1000);}}
function refresh(){clearTimeout(pendingSave);try{config=JSON.parse(native.settings());renderSetup();update();}catch(_){error('Couldn’t load your settings. Close and reopen the app.');}}
$('ambient-volume').addEventListener('input',()=>{$('ambient-volume-value').textContent=$('ambient-volume').value+'%';clearTimeout(pendingSave);pendingSave=setTimeout(save,120);});$('ambient-volume').addEventListener('change',save);appearance.bind(save);$('countdown').addEventListener('change',save);$('intervals').addEventListener('input',()=>{summary();clearTimeout(pendingSave);pendingSave=setTimeout(save,120);});$('intervals').addEventListener('change',save);$('minutes').addEventListener('change',save);$('minutes').addEventListener('input',summary);$('start').addEventListener('click',()=>{if(save()){if(native.start()!==true)error('The timer is already running.');update();}});$('pause').addEventListener('click',()=>{lastPhase==='paused'?native.resume():native.pause();update();});$('end').addEventListener('click',()=>{native.stop();update();});function closeSettings(){const active=['preparing','meditating','paused'].includes(lastPhase);if(!active&&!save())return;try{native.stopPreview?.();}catch(_){}$('settings-page').hidden=true;$('home').hidden=false;window.scrollTo(0,0);update();$('settings').focus({preventScroll:true});}
$('settings').addEventListener('click',()=>{clearTimerFade();$('home').hidden=true;$('settings-page').hidden=false;window.scrollTo(0,0);$('settings-back').focus({preventScroll:true});update();});$('settings-back').addEventListener('click',closeSettings);window.MeditationApp={refresh,back(){if(appearance.back())return true;if(!$('settings-page').hidden){closeSettings();return true;}return false;}};refresh();document.addEventListener('visibilitychange',()=>{if(document.hidden){clearTimeout(poll);clearTimerFade();}else refresh();});window.addEventListener('pagehide',()=>{clearTimeout(poll);clearTimerFade();});window.addEventListener('pageshow',e=>{if(e.persisted)refresh();});try{native.ready();}catch(_){}
