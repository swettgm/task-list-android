.plate-tip{flex:1 0 24px;height:var(--sleeve-height);margin-top:calc(var(--sleeve-axis) - var(--sleeve-height)/2)}
.plate-load-summary{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.plate-equipment{display:grid;gap:10px}.plate-equipment summary{width:max-content;max-width:100%;padding:6px 0;cursor:pointer}
.plate-inventory{display:grid;gap:6px;margin-top:6px}
.plate-inventory-row{display:grid;grid-template-columns:minmax(0,1fr) 98px;align-items:center;gap:10px}
.plate-inventory-label{justify-content:space-between}
.plate-inventory-label button{min-height:36px;width:36px;min-width:36px;padding:8px}
.plate-inventory-label button svg{width:16px;height:16px}
.plate-inventory-row input[type=number]{min-height:36px;padding-block:5px}
.plate-inventory-row input::placeholder{color:var(--muted);opacity:1}
.plate-inventory-row input:disabled{opacity:.4}
.plate-add{display:grid;grid-template-columns:minmax(0,1fr) 86px;align-items:end;gap:10px;margin-top:12px}
.plate-add button{min-height:42px}
.plate-add+.error{margin-top:6px}
.chevron{width:16px;height:16px}
.routine-chevron svg{width:26px;height:26px;opacity:.8}
.routine-chevron[aria-expanded=true]>svg{transform:rotate(180deg)}
details:not([open])>summary .chevron{transform:rotate(-90deg)}
.settings-back .chevron{transform:rotate(90deg)}
.field>.select-entry{display:block;position:relative;font-size:inherit;opacity:1}
.select-entry .chevron{position:absolute;right:10px;top:50%;transform:translateY(-50%);pointer-events:none}
details>summary{display:flex;align-items:center;gap:6px;list-style:none;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
details>summary::-webkit-details-marker{display:none}
.progress summary{min-height:38px;padding:7px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:700}
.history-card:first-child{padding-top:10px}
.field-heading{display:flex;align-items:center;justify-content:space-between;gap:4px;min-width:0}
.number-tools{display:inline-flex;flex:none;align-items:center;gap:2px}
.number-tools button,.number-grip,.textarea-grip{min-height:28px;width:28px;min-width:28px;padding:0;border:0;font-size:17px;background:transparent;color:var(--muted)}
.number-grip,.textarea-grip{touch-action:none;user-select:none}
.number-entry{position:relative;min-width:0}
.number-entry>input{display:block}
.number-grip{position:absolute;right:4px;top:50%;transform:translateY(-50%);min-height:34px;cursor:ns-resize}
.number-grip svg{width:16px;height:16px;stroke-width:4}
[data-number-mode=drag] .number-entry>input:not(:disabled),
[data-number-mode=drag] .number-entry>.weight-entry{padding-right:36px}
[data-number-mode=drag] .number-tools,[data-number-mode=buttons] .number-grip,[data-number-mode=keyboard] :is(.number-tools,.number-grip),
.settings-screen :is(.number-tools,.number-grip),.number-entry>input:disabled+.number-grip{display:none}
.textarea-entry{position:relative;max-width:100%}
.textarea-entry textarea{display:block;resize:none;padding-bottom:28px}
.textarea-grip{position:absolute;right:4px;bottom:3px;cursor:nwse-resize}
.textarea-grip svg{width:16px;height:16px;stroke-width:2.2}
.settings-changelog summary{padding-block:8px;font-size:16px;font-weight:700;cursor:pointer;-webkit-tap-highlight-color:transparent}
.settings-changelog section{margin-block:10px;padding-top:10px;border-top:1px solid var(--line)}
.settings-changelog ul{margin:6px 0 0;padding-inline-start:18px;color:var(--muted);font-size:14px}
</style>

function routineSlots(today){
 const schedule=state.settings.schedule,routines=state.routines;

 if(!schedule||schedule.mode==='off'||!routines.length)return unscheduled();

 let latest=null;
 for(const session of state.history){
  if(session.finishedAt>(latest?.finishedAt??0)&&state.routines.some(r=>r.id===session.routineId))latest=session;
 }
 const startIndex=latest?(state.routines.findIndex(r=>r.id===latest.routineId)+1)%state.routines.length:0;
 let day=Math.max(todayDay,latest?localDay(new Date(latest.finishedAt))+1:todayDay);

}

 const routine=data.routines.find(item=>item.id===session.routineId);
 if(!routine)return;
 const attempted=new Set(session.exercises.filter(exercise=>exercise.sets.some(hasLoggedReps)).map(exercise=>exercise.id));
 const previous=new Map();
 const failed=new Set(session.exercises.filter(exercise=>attempted.has(exercise.id)&&!metTargets(exercise)).map(exercise=>exercise.id));
 for(const workout of data.history){
  if(previous.size===failed.size)break;
  if(workout.routineId!==session.routineId)continue;
  for(const exercise of workout.exercises){
   if(failed.has(exercise.id)&&!previous.has(exercise.id)&&exercise.sets.some(hasLoggedReps)){
    previous.set(exercise.id,exercise);
   }
  }
 }
 for(const exercise of session.exercises){
  if(!attempted.has(exercise.id))continue;
  const stored=routine.exercises.find(entry=>entry.id===exercise.id);
  if(!stored||stored.weight!==exercise.weight||stored.unit!==exercise.unit)continue;
  delete stored.doubleProgression;
  const earnedIncrease=metTargets(exercise);
  const increase=progressionIncrease(stored,data.settings);

function renderProgress(){

  const workoutBest=new Map();
  for(const ex of session.exercises){
   const key=JSON.stringify([ex.name,ex.unit]);
   for(const set of ex.sets){
    if(!(set.reps>0))continue;
    const previous=workoutBest.get(key);
    if(!previous||set.weight>previous.weight||set.weight===previous.weight&&set.reps>previous.reps)
     workoutBest.set(key,{name:ex.name,unit:ex.unit,weight:set.weight,reps:set.reps});
   }
  }
  for(const [key,best]of workoutBest){
   if(!records.has(key))records.set(key,{best,weights:[]});
   const record=records.get(key);
   record.weights.push(best.weight);
   if(best.weight>record.best.weight||best.weight===record.best.weight&&best.reps>record.best.reps)record.best=best;
