<body>
<div id="app">
<header><h1>Exercise</h1><div class="toolbar-actions"><button id="add-routine" class="icon bare" aria-label="Add routine"></button><button id="settings" class="icon bare" aria-label="Settings"></button></div></header>
<nav class="tabs" role="tablist" aria-label="Workouts"><button id="today-tab" role="tab" aria-selected="true" aria-controls="today">Today</button><button id="history-tab" role="tab" aria-selected="false" aria-controls="history">History</button></nav>
<div id="page-stack">
<section id="today" role="tabpanel" aria-labelledby="today-tab">
<div id="routine-list"></div>
<template id="session-template"><div id="session-bar" class="session-bar"><span id="elapsed" class="elapsed"></span><div class="row"><button id="discard" class="icon bare" aria-label="Discard workout"></button><button id="finish" class="primary">Finish</button></div></div></template>
</section>
<section id="history" role="tabpanel" aria-labelledby="history-tab" hidden><div id="progress"></div><div id="history-list"></div></section>
</div></div>

<aside id="rest" class="rest-floater" aria-label="Rest timer" hidden><button id="rest-float" aria-label="Rest controls"><svg viewBox="0 0 84 84" aria-hidden="true"><circle class="timer-track" cx="42" cy="42" r="36"/><circle id="rest-ring" class="timer-ring" cx="42" cy="42" r="36" pathLength="100"/></svg><strong id="rest-time"></strong></button></aside>
<aside id="spotify" class="spotify" aria-label="Spotify player">
<span id="spotify-art" class="spotify-art" aria-hidden="true"></span><button id="spotify-open" class="spotify-track bare" aria-label="Open Spotify"><span id="spotify-title">Spotify</span><span id="spotify-artist"></span></button>
<button id="spotify-connect">Connect</button>
<button id="spotify-prev" class="icon bare" aria-label="Previous Spotify track"></button>
<button id="spotify-play" class="icon bare" aria-label="Play Spotify"></button>
<button id="spotify-next" class="icon bare" aria-label="Next Spotify track"></button>
</aside>
<div id="toast" class="toast" role="status" hidden></div>
<div id="failure" hidden><h2>Exercise</h2><p class="empty">Couldn’t read your saved workouts. Your data has been kept.</p><button id="retry">Try again</button></div>
<script>
'use strict';
(() => {
const native=window.WorkoutNative, KEY='workouts-v1', $=id=>document.getElementById(id);
const clone=value=>JSON.parse(JSON.stringify(value));
const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;};
const paths={back:'m15 5-7 7 7 7',music:'M9 18V5l11-2v13M9 8l11-2M9 18a3 3 0 1 1-3-3M20 16a3 3 0 1 1-3-3',play:'M8 5v14l11-7Z',pause:'M6 5h4v14H6ZM14 5h4v14h-4Z',prev:'M4 5h3v14H4ZM19 5v14L8 12Z',next:'M17 5h3v14h-3ZM5 5l11 7-11 7Z',gear:'M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0-16',plus:'M12 5v14M5 12h14',routinePlus:'M12 2v20M2 12h20',pencil:'M4 20l4-1L21 6l-4-4L4 15ZM14 5l4 4',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',chevron:'m5 9 7 7 7-7',close:'m6 6 12 12M6 18 18 6'};
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),path=document.createElementNS(svg.namespaceURI,'path');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');path.setAttribute('d',paths[name]);svg.append(path);return svg;}

function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function haptic(){try{native?.haptic();}catch(_){}}

function dateText(value,options={month:'short',day:'numeric',weekday:'short'}){return new Intl.DateTimeFormat(undefined,options).format(new Date(value));}
function duration(ms){const seconds=Math.max(0,Math.floor(ms/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function hasLoggedReps(set){return Number.isInteger(set?.reps)&&set.reps>=0;}
function completed(session){return session.exercises.reduce((n,e)=>n+e.sets.filter(hasLoggedReps).length,0);}
function total(session){return session.exercises.reduce((n,e)=>n+e.sets.length,0);}
function settingsDefault(){return {top:'#203747',bottom:'#5a5c61',text:'#f4f7fa',gradient:true,unit:'lb',rest:90,vibrationMs:350,notifications:false,spotify:true,floatingTimer:true};}
function initialState(){
 const routine={id:id(),name:'Workout A',exercises:[]};
 return {version:1,revision:0,routines:[routine],selected:routine.id,active:null,history:[],restEndAt:0,restStartedAt:0,restDurationMs:0,settings:settingsDefault()};
}
let settingsOpen=false,closeSettings=null;
let state=null,view='today',closeDialog=null,toastTimer,slide=null,gesture=null,drag=null,suppressUntil=0,announcedRest=0;
function read(){const raw=native?native.readState():localStorage.getItem(KEY);if(raw===null&&native)throw Error('Unreadable data');const value=JSON.parse(raw||'{}');return Object.keys(value).length?value:null;}
function load(){try{state=read();if(!state){state=initialState();if(!save(()=>{}))throw Error('Could not initialize');}if(state.version!==1||!Array.isArray(state.routines)||!Array.isArray(state.history)||!state.settings)throw Error('Invalid data');$('failure').hidden=true;$('app').hidden=false;theme();render();}catch(_){$('app').hidden=true;$('rest').hidden=true;$('failure').hidden=false;}finally{native?.ready();}}
function save(change,errorNode){try{const next=clone(read()||state);change(next);if(native){const saved=native.writeState(JSON.stringify(next));if(!saved)throw Error('Save failed');state=JSON.parse(saved);}else{next.revision=(next.revision||0)+1;localStorage.setItem(KEY,JSON.stringify(next));state=next;}return true;}catch(_){const message='Couldn’t save. Your changes are still here; try again.';if(errorNode)errorNode.textContent=message;else toast(message);return false;}}
function liveRoutine(data,routineId){return data.active?.routineId===routineId?data.active:null;}

 drag=null;
 clearTimeout(d.timer);
 if(!d.active)return;
 cancelAnimationFrame(d.frame);
 d.ghost.remove();
 d.card.classList.remove('drag-source');
 const cancelClick=event=>{event.preventDefault();event.stopImmediatePropagation();};
 d.list.addEventListener('click',cancelClick,true);
 setTimeout(()=>d.list.removeEventListener('click',cancelClick,true),450);
 const order=[...d.list.children].map(row=>row.dataset.exerciseId);
 if(order.join()===d.original.join())return;
 const positions=new Map(order.map((id,index)=>[id,index]));
 const sort=(a,b)=>(positions.get(a.id)??100)-(positions.get(b.id)??100);
 if(commit&&save(next=>{
  const routine=next.routines.find(r=>r.id===d.routineId);
  routine?.exercises.sort(sort);
  liveRoutine(next,d.routineId)?.exercises.sort(sort);
 },d.modal.error)){
  haptic();
  renderToday();
  return;
 }
 const rows=new Map([...d.list.children].map(row=>[row.dataset.exerciseId,row]));
 d.list.append(...d.original.map(id=>rows.get(id)));
}
document.addEventListener('pointermove',event=>{if(!drag||drag.id!==event.pointerId)return;drag.y=event.clientY;if(!drag.active&&Math.hypot(event.clientX-drag.startX,event.clientY-drag.startY)>12){clearTimeout(drag.timer);drag=null;return;}if(drag.active&&event.cancelable)event.preventDefault();},{passive:false});
document.addEventListener('pointerup',event=>{if(drag?.id===event.pointerId)finishDrag(true);});document.addEventListener('pointercancel',()=>finishDrag(false));window.addEventListener('blur',()=>{finishRepDrag(false);finishTimerDrag(false);gesture=null;finishSlide(false,false);finishDrag(false);});
function viewport(){document.documentElement.style.setProperty('--height',(visualViewport?.height||innerHeight)+'px');if(state&&!timerDrag)placeTimer();}viewport();window.addEventListener('resize',viewport);visualViewport?.addEventListener('resize',viewport);
function refresh(){if(closeDialog||settingsOpen||drag||slide||repDrag)return;try{const saved=read();if(saved){state=saved;theme();render();}}catch(_){toast('Couldn’t reload saved workouts.');}}
window.Workouts=Object.freeze({refresh,back(){if(settingsOpen&&!closeDialog){closeSettings();return true;}if(closeDialog){closeDialog();return true;}if(slide){finishSlide(false,false);return true;}if(view==='history'){switchView('today');return true;}return false;},debug:()=>clone(state)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){refresh();tick();}});setInterval(tick,250);setInterval(renderSpotify,1500);
setInterval(()=>{
 if(!state||!native?.restState)return;
 try{
  const rest=JSON.parse(native.restState());
  state.restEndAt=rest.end;state.restDurationMs=rest.duration;state.restStartedAt=rest.started;
  tick();
 }catch(_){}
},1000);
load();
})();
</script>
