<title>Workouts</title>
<style>

und:var(--text);border-color:var(--text);color:var(--ink);font-weight:700}.set-add{opacity:.65}.set-add svg{width:16px;height:16px}.start{width:100%;margin-top:18px;min-height:44px}.session-bar{margin:10px 0 0;display:flex;align-items:center;justify-content:space-between;gap:8px}.session-bar .row{gap:6px}.elapsed{font-variant-numeric:tabular-nums;font-size:14px;opacity:.75}.last-set{margin-top:6px;font-size:12px;opacity:.65}.empty{font-size:15px;opacity:.7;line-height:1.5;padding:20px 0}.fab{position:fixed;right:max(18px,calc((100vw - 700px)/2));bottom:22px;width:58px;height:58px;border:0;border-radius:16px;background:var(--text);color:var(--ink);box-shadow:0 4px 20px #0003;padding:14px;z-index:5}.fab svg{width:30px;height:30px;stroke-width:3}#page-stack{position:relative;overflow:hidden}.outgoing{position:absolute;inset:0 0 auto;width:100%;pointer-events:none}

er;background-size:16px}input[type=color]{width:44px;min-width:44px;height:42px;padding:4px}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.error{font-size:13px;color:#ffb9c4;white-space:pre-wrap;flex:none}.error:empty{display:none}.choice-list{display:grid;gap:6px}.choice-list button{justify-content:flex-start;text-align:left;overflow-wrap:anywhere}.choice-list button[aria-pressed=true]{border:2px solid var(--text)}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);max-width:calc(100% - 32px);padding:9px 13px;border:1px solid var(--line);border-radius:11px;background:var(--top);font-size:13px;z-index:100}.slider-row{display:flex;align-items:center;gap:12px}.slider-row input{flex:1;padding:0;border:0;min-height:32px;accent-color:var(--text)}.slider-row output{width:52px;flex:none;font-size:14px;text-align:right}.drag-source{opacity:.22;border-top:2px solid var(--text)}.drag-ghost{position:fixed;z-index:100;pointer-events:none;background:var(--top);border:1.5px solid var(--text);border-radius:12px;padding:12px;box-shadow:0 10px 26px #0006;margin:0;opacity:.96}.dragging,.dragging *{cursor:grabbing!important;-webkit-user-select:none!important;user-select:none!important}
@media(max-width:350px){body{padding-left:12px;padding-right:12px}dialog{padding:16px}.exercise-name{font-size:16px}.exercise-plan{font-size:12px}.set{width:40px;min-width:40px;height:40px;min-height:40px}.actions button{padding:7px 9px;font-size:13px}}
.spotify{position:fixed;bottom:18px;left:16px;right:16px;max-width:700px;margin:auto;min-height:54px;display:flex;align-items:center;gap:2px;padding:6px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--top);box-shadow:0 4px 20px #0003;z-index:6}.spotify-track{flex:1;min-width:0;display:flex;align-items:flex-start;flex-direction:column;gap:2px;padding:2px 4px;font-size:13px;text-align:left}.spotify-track span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}#spotify-artist{font-size:11px;opacity:.7}.spotify .icon{width:32px;min-width:32px;min-height:36px;padding:6px}.spotify .icon svg{width:19px;height:19px}#spotify-connect{font-size:12px;min-height:32px;padding:5px 7px}body.has-player{padding-bottom:180px}body.has-player .fab,body.has-player .rest{bottom:88px}
#settings svg{width:28px;height:28px}.routine-picker:disabled{opacity:1}

dialog .actions .trash{width:42px;min-width:42px}
.spotify{gap:4px}
.rest{height:58px}.rest-time{line-height:1.15}.rest-time strong{line-height:1.1}.spotify{height:58px;min-height:58px}

<body>
<div id="app">
<header><h1>Workouts</h1><button id="settings" class="icon bare" aria-label="Settings"></button></header>
<nav class="tabs" role="tablist" aria-label="Workouts"><button id="today-tab" role="tab" aria-selected="true" aria-controls="today">Today</button><button id="history-tab" role="tab" aria-selected="false" aria-controls="history">History</button></nav>
<div id="page-stack">
<section id="today" role="tabpanel" aria-labelledby="today-tab">
<p id="today-date" class="date"></p>
<div class="routine-heading"><button id="routine-picker" class="routine-picker bare"></button><button id="routine-edit" class="icon bare" aria-label="Edit routine"></button></div>
<div id="session-bar" class="session-bar" hidden><span id="elapsed" class="elapsed"></span><div class="row"><button id="discard" class="icon bare trash" aria-label="Discard workout"></button><button id="finish" class="primary">Finish</button></div></div>
<div id="exercises"></div><button id="start" class="start primary">Start workout</button>
</section>
<section id="history" role="tabpanel" aria-labelledby="history-tab" hidden><div id="progress"></div><div id="history-list"></div></section>
</div></div>
<button id="add" class="fab" aria-label="Add exercise"></button>
<aside id="rest" class="rest" aria-label="Rest timer" hidden><div class="rest-time">Rest<strong id="rest-time"></strong></div><button id="rest-add">+30s</button><button id="rest-skip" class="icon bare" aria-label="Skip rest"></button></aside>
<aside id="spotify" class="spotify" aria-label="Spotify player">
<button id="spotify-open" class="spotify-track bare" aria-label="Open Spotify"><span id="spotify-title">Spotify</span><span id="spotify-artist"></span></button>
<button id="spotify-connect">Connect</button>
<button id="spotify-prev" class="icon bare" aria-label="Previous Spotify track"></button>
<button id="spotify-play" class="icon bare" aria-label="Play Spotify"></button>
<button id="spotify-next" class="icon bare" aria-label="Next Spotify track"></button>
</aside>
<div id="toast" class="toast" role="status" hidden></div>
<div id="failure" hidden><h2>Workouts</h2><p class="empty">Couldn’t read your saved workouts. Your data has been kept.</p><button id="retry">Try again</button></div>
<script>
'use strict';
(() => {
const native=window.WorkoutNative, KEY='workouts-v1', $=id=>document.getElementById(id);
const clone=value=>JSON.parse(JSON.stringify(value));
const el=(tag,cls,text)=>{const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node;};
const paths={play:'M8 4l12 8-12 8Z',pause:'M8 5v14M16 5v14',prev:'M5 5v14M19 5 8 12l11 7Z',next:'M19 5v14M5 5l11 7-11 7Z',gear:'M12 8a4 4 0 1 0 0 8a4 4 0 0 0 0-8M12 2v3m0 14v3M2 12h3m14 0h3M5 5l2 2m10 10 2 2M5 19l2-2M17 7l2-2M12 4a8 8 0 1 0 0 16a8 8 0 0 0 0-16',plus:'M12 5v14M5 12h14',pencil:'m15 4 5 5M4 20l4-1L21 6l-4-4L4 15Z',trash:'M4 6h16M9 6V3h6v3M6 6l1 15h10l1-15M10 10v7M14 10v7',chevron:'m5 9 7 7 7-7',close:'m6 6 12 12M6 18 18 6'};
function icon(name){const svg=document.createElementNS('http://www.w3.org/2000/svg','svg'),path=document.createElementNS(svg.namespaceURI,'path');svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('aria-hidden','true');path.setAttribute('d',paths[name]);svg.append(path);return svg;}
function button(label,action,cls=''){const node=el('button',cls,label);node.type='button';node.onclick=action;return node;}
function id(){return Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,10);}
function haptic(){try{native?.haptic();}catch(_){}}
function toast(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>$('toast').hidden=true,2400);}
function dateText(value,options={month:'short',day:'numeric',weekday:'short'}){return new Intl.DateTimeFormat(undefined,options).format(new Date(value));}
function duration(ms){const seconds=Math.max(0,Math.floor(ms/1000));return String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0');}
function completed(session){return session.exercises.reduce((n,e)=>n+e.sets.filter(s=>s.reps!==null).length,0);}
function total(session){return session.exercises.reduce((n,e)=>n+e.sets.length,0);}
function settingsDefault(){return {top:'#203747',bottom:'#5a5c61',text:'#f4f7fa',gradient:true,unit:'lb',rest:90,vibrationMs:350,notifications:false,spotify:true};}
function initialState(){
 const routine={id:id(),name:'Workout A',exercises:[]};
 return {version:1,revision:0,routines:[routine],selected:routine.id,active:null,history:[],restEndAt:0,settings:settingsDefault()};
}
let state=null,view='today',closeDialog=null,toastTimer,slide=null,gesture=null,drag=null,suppressUntil=0,announcedRest=0;
function read(){const raw=native?native.readState():localStorage.getItem(KEY);if(raw===null&&native)throw Error('Unreadable data');const value=JSON.parse(raw||'{}');return Object.keys(value).length?value:null;}
function load(){try{state=read();if(!state){state=initialState();if(!save(()=>{}))throw Error('Could not initialize');}if(state.version!==1||!Array.isArray(state.routines)||!Array.isArray(state.history)||!state.settings)throw Error('Invalid data');$('failure').hidden=true;$('app').hidden=false;theme();render();}catch(_){$('app').hidden=true;$('add').hidden=true;$('rest').hidden=true;$('failure').hidden=false;}finally{native?.ready();}}
function save(change,errorNode){const next=clone(state);try{change(next);if(native){const saved=native.writeState(JSON.stringify(next));if(!saved)throw Error('Save failed');state=JSON.parse(saved);}else{next.revision=(next.revision||0)+1;localStorage.setItem(KEY,JSON.stringify(next));state=next;}return true;}catch(_){const message='Couldn’t save. Your changes are still here; try again.';if(errorNode)errorNode.textContent=message;else toast(message);return false;}}
function routine(){return state.routines.find(r=>r.id===state.selected)||state.routines[0];}
function current(){return state.active||routine();}
function theme(){const s=state.settings;for(const key of ['top','bottom','text'])document.documentElement.style.setProperty('--'+key,s[key]);document.documentElement.style.setProperty('--muted','color-mix(in srgb,'+s.text+' 70%,'+s.top+')');document.documentElement.style.setProperty('--line','color-mix(in srgb,'+s.text+' 27%,transparent)');const rgb=parseInt(s.text.slice(1),16);document.documentElement.style.setProperty('--ink',((rgb>>16)*.299+((rgb>>8)&255)*.587+(rgb&255)*.114)>160?'#172631':'#ffffff');document.body.classList.toggle('flat',!s.gradient);native?.setThemeColors(s.top,s.gradient?s.bottom:s.top);}
function modal(title){if(closeDialog)closeDialog();const oldY=scrollY,dialog=el('dialog'),heading=el('h2','',title),fields=el('div','fields'),error=el('p','error'),actions=el('div','actions');error.setAttribute('role','alert');dialog.append(heading,fields,error,actions);document.body.append(dialog);document.documentElement.style.overflow='hidden';Object.assign(document.body.style,{position:'fixed',top:-oldY+'px',left:'0',right:'0'});native?.setModalOpen(true);native?.hideKeyboard();
const close=()=>{if(!dialog.isConnected)return;dialog.close();dialog.remove();closeDialog=null;document.documentElement.style.overflow='';for(const key of ['position','top','left','right'])document.body.style[key]='';scrollTo(0,oldY);native?.setModalOpen(false);native?.hideKeyboard();};
closeDialog=close;dialog.addEventListener('cancel',event=>{event.preventDefault();close();});let outside=false;const isOutside=event=>{const box=dialog.getBoundingClientRect();return event.clientX<box.left||event.clientX>box.right||event.clientY<box.top||event.clientY>box.bottom;};dialog.onpointerdown=event=>outside=event.target===dialog&&isOutside(event);dialog.onclick=event=>{if(outside&&event.target===dialog&&isOutside(event))close();outside=false;};dialog.showModal();dialog.focus({preventScroll:true});return {dialog,fields,error,actions,close};}
function field(parent,label,type,value=''){const wrap=el('label','field');wrap.append(el('span','',label));const input=el(type==='textarea'?'textarea':'input');if(type!=='textarea')input.type=type;input.value=value;input.setAttribute('aria-label',label);wrap.append(input);parent.append(wrap);return input;}
function numberField(parent,label,value,min,max,step=1){const input=field(parent,label,'number',value);input.min=min;input.max=max;input.step=step;input.inputMode=step===1?'numeric':'decimal';return input;}
function checkbox(parent,label,value){const wrap=el('label','check-label'),input=el('input');input.type='checkbox';input.checked=value;wrap.append(input,el('span','',label));parent.append(wrap);return input;}
function selectField(parent,label,options,value){const wrap=el('label','field'),select=el('select');select.setAttribute('aria-label',label);wrap.append(el('span','',label),select);for(const item of options){const option=el('option','',item);option.value=item;select.append(option);}select.value=value;parent.append(wrap);return select;}
function cancelSave(m,action,label='Save'){m.actions.append(button('Cancel',m.close),button(label,action,'primary'));}
function deleteButton(label,remove){let armed=false,timer;const control=button('',()=>{if(!armed){armed=true;control.classList.add('danger');control.setAttribute('aria-label','Confirm delete '+label);timer=setTimeout(()=>{armed=false;control.classList.remove('danger');control.setAttribute('aria-label','Delete '+label);},3000);return;}clearTimeout(timer);remove();},'icon trash');control.append(icon('trash'));control.setAttribute('aria-label','Delete '+label);return control;}
function notes(parent,text){const fragment=el('div','exercise-notes');const pattern=/\[([^\]\n]+)\]\((https?:\/\/[^\s]+)\)|https?:\/\/[^\s<>]+/gi;let from=0;for(const match of String(text).matchAll(pattern)){fragment.append(document.createTextNode(text.slice(from,match.index)));const label=match[1]||match[0],url=(match[2]||match[0]).replace(/[.,;!?]+$/,'');let target;try{target=new URL(url);}catch(_){fragment.append(document.createTextNode(match[0]));from=match.index+match[0].length;continue;}const link=el('a','',label);link.href=target.href;link.rel='noopener noreferrer';link.onclick=event=>event.stopPropagation();fragment.append(link);from=match.index+match[0].length;}fragment.append(document.createTextNode(String(text).slice(from)));parent.append(fragment);}
function plan(ex){const targets=ex.sets.map(s=>s.target),same=targets.every(n=>n===targets[0]);return (same?targets.length+' × '+targets[0]:targets.join('/'))+' · '+ex.weight+' '+ex.unit;}
function lastSet(ex){for(const session of [...state.history].sort((a,b)=>b.finishedAt-a.finishedAt)){const match=session.exercises.find(e=>e.id===ex.id||e.name===ex.name&&e.unit===ex.unit);const done=match?.sets.filter(s=>s.reps!==null);if(done?.length){const best=done.reduce((a,b)=>a.weight>b.weight?a:b);return 'Last time '+best.weight+' '+ex.unit+' × '+best.reps;}}return '';}
function render(){renderToday();renderHistory();$('add').hidden=view!=='today';tick();renderSpotify();}
function renderToday(){const source=current();$('today-date').textContent=dateText(Date.now(),{weekday:'long',month:'short',day:'numeric'});$('routine-picker').replaceChildren(el('span','',source?.name||'Choose a routine'),icon('chevron'));$('routine-picker').disabled=!!state.active;$('routine-edit').hidden=!source;$('start').hidden=!!state.active;$('start').disabled=!source?.exercises.length;$('session-bar').hidden=!state.active;$('exercises').replaceChildren();
