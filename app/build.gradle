plugins {
    id 'com.android.application'
}

android {
    namespace 'com.personal.tasklist'
    compileSdk 35
    buildToolsVersion '35.0.0'

    signingConfigs {
        debug {
            if (System.getenv('TASK_DEBUG_KEYSTORE')) {
                storeFile file(System.getenv('TASK_DEBUG_KEYSTORE'))

                if (System.getenv('TASK_DEBUG_STORE_PASSWORD')) storePassword System.getenv('TASK_DEBUG_STORE_PASSWORD')

                if (System.getenv('TASK_DEBUG_KEY_ALIAS')) keyAlias System.getenv('TASK_DEBUG_KEY_ALIAS')

                if (System.getenv('TASK_DEBUG_KEY_PASSWORD')) keyPassword System.getenv('TASK_DEBUG_KEY_PASSWORD')
            }
        }
    }

    defaultConfig {
        applicationId 'com.personal.tasklist'
        applicationIdSuffix '.preview'
        minSdk 26
        targetSdk 35
        versionCode 102
        versionName '0.100.2'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                systemProperty 'robolectric.dependency.repo.url', 'https://repo.maven.apache.org/maven2'
            }
        }
    }
}

dependencies {
    implementation 'com.google.android.gms:play-services-auth:22.0.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
}
