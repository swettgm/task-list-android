      const button=el('button','tm-move-control','Do tomorrow ➜');
      button.type='button';
      button.setAttribute('aria-label','Move '+item.task.title+' to tomorrow');
      button.addEventListener('click',()=>{
        const id=occurrenceId(item.task,item.stateDate);
        movedTo[id]=addDays(today,1);
        delete rolloverCompletedOn[id];
        saveLocalState();renderToday();renderFuture();
        find('pt-status').textContent='Moved to tomorrow · saved locally';
      });
      return button;
    };
    const updateDraftStatus=()=>{
      const keys=new Set([...Object.keys(saved),...Object.keys(draft)]);
      const changed=[...keys].filter(k=>Boolean(saved[k])!==Boolean(draft[k])).length;
      find('pt-save').disabled=!changed;
      find('pt-save').textContent=changed?'Save Completed ('+changed+')':'Save Completed';
      if(changed)find('pt-status').textContent='Unsaved changes';
    };
    const checklistDetails=(task,date,parentInput,parentTitle,completed=false)=>{
      const details=el('details','tm-children');
      details.open=false;
      const summary=el('summary','cursor-interaction');
      const count=subtaskCount(task,date),unit=task.children?'subtasks':'steps';
      const updateCount=()=>{
        const checked=Array.from({length:count},(_,i)=>Boolean(draft[childKey(task,date,i)])).filter(Boolean).length;
        summary.textContent=checked+' / '+count+' '+unit;
        if(parentInput){
          parentInput.checked=checked===count;
          if(parentTitle)parentTitle.classList.toggle('tm-staged',parentInput.checked&&!completed);
        }
      };
      const addStep=(name,index,childList)=>{
        const key=childKey(task,date,index);
        const childItem=el('div','tm-task-item tm-child-item');
        const childLabel=el('label','form-check');
        const checkbox=el('input','form-check-input');checkbox.type='checkbox';checkbox.checked=Boolean(draft[key]);
        checkbox.addEventListener('change',()=>{draft[key]=checkbox.checked;updateCount();updateDraftStatus();});
        const childText=el('span','form-check-label');
        const childTitle=el('span',undefined,name);
        const childActive=inProgress===key;
        if(childActive)childTitle.classList.add('tm-in-progress-title');
        const childTitleLine=el('span','tm-title-line'),childTitleMain=el('span','tm-title-main');childTitleMain.append(childTitle);
        if(childActive)childTitleMain.append(el('span','tm-in-progress-badge','🟢 IN PROGRESS'));
        childTitleLine.append(childTitleMain);
        childText.append(childTitleLine);
        childLabel.append(checkbox,childText);
        const childControls=el('div','tm-item-actions');
        childControls.append(progressButton(key,task.title+' > '+name,Boolean(draft[key])));
        childItem.append(childLabel,childControls);
        childList.append(childItem);
      };
      details.append(summary);
      if(task.children){
        let index=0;
        childGroupsForDate(task,date).forEach(([category,names])=>{
          details.append(el('div','tm-group text-small',category));
          const childList=el('div','tm-list');
          names.forEach(name=>addStep(name,index++,childList));
          details.append(childList);
        });
      } else {
        const childList=el('div','tm-list');
        stepsFor(task,date).forEach((name,index)=>addStep(name,index,childList));
        details.append(childList);
      }
      updateCount();
      return details;
    };
    const row=(item,completed=false,number)=>{
      const {task,stateDate}=item;
      const wrapper=el('div','tm-task-item');
      const active=inProgress===progressKey(task,stateDate);
      if(active)wrapper.classList.add('tm-in-progress-item');
      const linkedActive=!completed&&!isDone(task,stateDate,draft)&&linkedInProgress(task,item.date);
      if(linkedActive)wrapper.classList.add('tm-linked-active');
      const label=el('label','form-check');
      const input=el('input','form-check-input');input.type='checkbox';
      input.checked=isDone(task,stateDate,draft);
      input.setAttribute('aria-label',(completed?'Reopen ':'Complete ')+task.title);
      const text=el('span','form-check-label');
      const title=el('span','tm-title',task.title);
      if(active)title.classList.add('tm-in-progress-title');
      const titleLine=el('span','tm-title-line'),titleMain=el('span','tm-title-main');titleMain.append(title);
      if(linkedActive)titleMain.append(el('span','tm-linked-chain','🔗'));
      if(task.urgent)titleMain.append(el('span','tm-in-progress-badge','🟢 URGENT'));
      if(active)titleMain.append(el('span','tm-in-progress-badge','🟢 IN PROGRESS'));
      titleLine.append(titleMain);
      text.append(titleLine,el('span','tm-meta',meta(task,number)));
      if(task.instruction)text.append(el('span','tm-ai-note',task.instruction));
      const origin=originNote(item);if(origin)text.append(el('span','tm-meta tm-overdue',origin));
      if(task.aiHelp)text.append(el('span','tm-ai-note',helpNote(task)));
      if(!completed){const pairing=pairNote(task,item.date);if(pairing)text.append(pairing);}
      if(task.notes)text.setAttribute('data-tooltip',task.notes);
      if(input.checked && !completed) title.classList.add('tm-staged');
      label.append(input,text);
      const controls=el('div','tm-item-actions');
      controls.append(progressButton(progressKey(task,stateDate),task.title,isDone(task,stateDate,draft)));
      const move=completed?null:moveButton(item);if(move)controls.append(move);
      wrapper.append(label,controls);
      if(hasSubtasks(task)){
        const count=subtaskCount(task,stateDate),unit=task.children?'subtasks':'steps';
        input.setAttribute('aria-label',task.title+'; toggle completion for the task and all '+count+' '+unit);
        input.title='Complete or reopen this task and its entire checklist';
        input.addEventListener('change',()=>{
          for(let index=0;index<count;index++)draft[childKey(task,stateDate,index)]=input.checked;
          renderToday();renderFuture();
        });
        wrapper.append(checklistDetails(task,stateDate,input,title,completed));
      } else {
        input.addEventListener('change',()=>{draft[occurrenceKey(task,stateDate)]=input.checked;title.classList.toggle('tm-staged',input.checked&&!completed);updateDraftStatus();});
      }
      window.TaskListBridge.decorateRow(wrapper,task,item,completed);
      return wrapper;
    };
    const renderToday=()=>{
      find('pt-date').textContent=labelDate(today,true);
      const items=dueToday().filter(i=>window.TaskListBridge.contextMatches(i.task)),pending=items.filter(i=>!isDone(i.task,i.stateDate,draft)),done=items.filter(i=>isDone(i.task,i.stateDate,draft));
      const activeItems=items.filter(i=>!isDone(i.task,i.stateDate,saved)),savedDone=items.filter(i=>isDone(i.task,i.stateDate,saved));
      const activeNumbers=new Map(),completedNumbers=new Map();
      groups.forEach(([priority])=>activeItems.filter(i=>i.task.priority===priority).forEach(i=>activeNumbers.set(progressKey(i.task,i.stateDate),activeNumbers.size+1)));
      savedDone.forEach((i,index)=>completedNumbers.set(progressKey(i.task,i.stateDate),index+1));
      const minutes=pending.reduce((n,i)=>n+(i.task.minutes||0),0),untimed=pending.filter(i=>i.task.minutes===undefined).length;
      find('pt-progress').textContent=done.length+' / '+items.length+' completed · '+pending.length+' pending · '+minutes+'m remaining'+(untimed?' + '+untimed+' untimed':'');
      const current=find('pt-current'),currentTitle=progressTitle(inProgress);
      current.hidden=!currentTitle;
      current.replaceChildren();
      if(currentTitle){
        current.hidden=false;
        const currentTask=tasks.find(task=>task.id===inProgress.split(':')[0]);
        const currentTitleLine=el('span','tm-title-line'),currentTitleMain=el('span','tm-title-main',currentTitle);
        currentTitleLine.append(currentTitleMain);
        if(currentTask){const pairing=pairNote(currentTask,today);if(pairing)currentTitleLine.append(pairing);}
        current.append(el('span','tm-in-progress-badge','🟢 IN PROGRESS'),currentTitleLine);
      }
      const percent=items.length?Math.round(done.length/items.length*100):100;
      find('pt-progressbar').setAttribute('aria-valuenow',String(percent));find('pt-progressfill').style.width=percent+'%';
      const list=find('pt-list');list.replaceChildren();
      groups.forEach(([priority,heading])=>{
        const matching=activeItems.filter(i=>i.task.priority===priority);if(!matching.length)return;
        list.append(el('div','tm-group text-small',heading));const rows=el('div','tm-list');
        matching.forEach(i=>rows.append(row(i,false,activeNumbers.get(progressKey(i.task,i.stateDate)))));list.append(rows);
      });
      if(!activeItems.length){
        const message=el('p','tm-group tm-all-done','You’re all done! Get some rest 🪻');
        message.setAttribute('role','status');
        list.append(message);
      }
      const overdueBox=find('pt-overdue');overdueBox.replaceChildren();const old=overdue().filter(i=>window.TaskListBridge.contextMatches(i.task));
      if(old.length){
        const details=el('details');details.append(el('summary','cursor-interaction','Overdue: '+old.length+' · separate from today’s total'));
        old.forEach((i,index)=>{details.append(el('div','text-small text-muted',labelDate(i.stateDate)));details.append(row(i,false,index+1));});overdueBox.append(details);
      }
      find('pt-completed-summary').textContent='Completed today: '+(savedDone.length?savedDone.map(i=>i.task.title).join('; '):'none');
      find('pt-completed-list').replaceChildren(...savedDone.map(i=>row(i,true,completedNumbers.get(progressKey(i.task,i.stateDate)))));
      updateDraftStatus();
    };
    const renderFuture=()=>{
      const container=find('pt-future-list');container.replaceChildren();
      for(let offset=1;offset<=14;offset++){
        const date=addDays(today,offset),items=onDate(date).filter(i=>!isDone(i.task,i.stateDate,saved)&&window.TaskListBridge.contextMatches(i.task));if(!items.length)continue;
        const taskNumbers=new Map();
        groups.forEach(([priority])=>items.filter(i=>i.task.priority===priority).forEach(i=>taskNumbers.set(progressKey(i.task,i.stateDate),taskNumbers.size+1)));
        const section=el('section','tm-day');section.append(el('div','tm-group',labelDate(date,true)));
        groups.forEach(([priority,heading])=>{
          const matching=items.filter(i=>i.task.priority===priority);if(!matching.length)return;
          section.append(el('div','tm-group text-small',heading));
          const rows=el('div','tm-list');
          matching.forEach(i=>{
            const card=el('div','tm-future-card');
            const line=el('div','tm-task-item tm-future');
            const active=inProgress===progressKey(i.task,i.stateDate);
            if(active)line.classList.add('tm-in-progress-item');
            const linkedActive=linkedInProgress(i.task,date);
            if(linkedActive)line.classList.add('tm-linked-active');
            const content=el('div','tm-future-content');
            const title=el('span','tm-title',i.task.title);
            if(active)title.classList.add('tm-in-progress-title');
            const titleLine=el('span','tm-title-line'),titleMain=el('span','tm-title-main');titleMain.append(title);
            if(linkedActive)titleMain.append(el('span','tm-linked-chain','🔗'));
            if(i.task.urgent)titleMain.append(el('span','tm-in-progress-badge','🟢 URGENT'));
            if(active)titleMain.append(el('span','tm-in-progress-badge','🟢 IN PROGRESS'));
            titleLine.append(titleMain);
            content.append(titleLine,el('span','tm-meta',meta(i.task,taskNumbers.get(progressKey(i.task,i.stateDate)))));
            if(i.task.instruction)content.append(el('span','tm-ai-note',i.task.instruction));
            const origin=originNote(i);if(origin)content.append(el('span','tm-meta tm-overdue',origin));
            if(i.task.aiHelp)content.append(el('span','tm-ai-note',helpNote(i.task)));
            const pairing=pairNote(i.task,date);if(pairing)content.append(pairing);
            if(i.task.notes)content.setAttribute('data-tooltip',i.task.notes);
            const futureControls=el('div','tm-item-actions');
            futureControls.append(progressButton(progressKey(i.task,i.stateDate),i.task.title,isDone(i.task,i.stateDate,draft)));
            line.append(content,futureControls);
            card.append(line);
            if(hasSubtasks(i.task))card.append(checklistDetails(i.task,i.stateDate,null,null));
            window.TaskListBridge.decorateRow(card,i.task,i,false);
            rows.append(card);
          });
          section.append(rows);
        });container.append(section);
      }
      if(!container.children.length)container.append(el('p',undefined,'No upcoming tasks in the next two weeks.'));
    };
    find('pt-save').addEventListener('click',()=>{
      const todayItems=dueToday();
      todayItems.filter(i=>i.stateDate!==today).forEach(i=>{
        const id=occurrenceId(i.task,i.stateDate);
        if(isDone(i.task,i.stateDate,draft))rolloverCompletedOn[id]=today;
        else if(rolloverCompletedOn[id]===today)delete rolloverCompletedOn[id];
      });
      saved={...draft};
      if(inProgressIsDone(saved))inProgress=null;
      let persisted=false;
      if(storageAvailable)try{localStorage.setItem(storageKey,JSON.stringify({version:2026103022,completed:saved,inProgress,progressStateInitialized,movedTo,rolloverCompletedOn,updatedAt:new Date().toISOString()}));persisted=true;}catch(error){storageAvailable=false;}
      renderToday();renderFuture();
      find('pt-status').textContent=persisted?'Saved locally · chat not synced':'Saved in this open view · chat not synced';
    });
    const showView=view=>{
      const todayView=view==='today';
      find('pt-today').hidden=!todayView;
      find('pt-upcoming').hidden=todayView;
      find('pt-today-tab').classList.toggle('active',todayView);
      find('pt-upcoming-tab').classList.toggle('active',!todayView);
      find('pt-today-tab').setAttribute('aria-selected',String(todayView));
      find('pt-upcoming-tab').setAttribute('aria-selected',String(!todayView));
    };
    find('pt-today-tab').addEventListener('click',()=>showView('today'));
    find('pt-upcoming-tab').addEventListener('click',()=>showView('upcoming'));
    const buildProgressText=(full=false)=>{
      const updates=[];
      const keys=full?Object.keys(saved):[...new Set([...Object.keys(saved),...Object.keys(explicitUpdates)])]
        .filter(key=>Boolean(saved[key])!==Boolean(explicitUpdates[key]));
      for(const key of keys){
        const parts=key.split(':'),task=tasks.find(t=>t.id===parts[0]);if(!task)continue;
        let title=task.title;
        if(parts[2]==='child'){
          const visibleIndex=childIndexesForDate(task,parts[1]).indexOf(Number(parts[3]));if(visibleIndex<0)continue;
          title+=' > '+childNamesForDate(task,parts[1])[visibleIndex];
        } else if(parts[2]==='step'){
          const name=stepsFor(task,parts[1])[Number(parts[3])];if(!name)continue;
          title+=' > '+name;
        } else if(parts[2]==='retired'){
          title+=' > '+parts.slice(3).join(':');
        }
        updates.push(parts[1]+' | '+(saved[key]?'COMPLETE':'PENDING')+' | '+title);
      }
      if(full || inProgress!==chatSnapshotActive){
        if(inProgress){
          const parts=inProgress.split(':'),title=progressTitle(inProgress);
          if(title)updates.push(parts[1]+' | IN PROGRESS | '+title);
        } else updates.push(today+' | IN PROGRESS | NONE');
      }
      Object.entries(movedTo).forEach(([id,target])=>{
        if(!full && chatSnapshotMoves[id]===target)return;
        const parsed=occurrenceFromId(id);if(!parsed)return;
        const [taskId,sourceDate]=parsed,task=tasks.find(t=>t.id===taskId);
        if(task)updates.push(sourceDate+' | MOVED TO | '+target+' | '+task.title);
      });
      if(!full && !updates.length)return null;
      return ['Saved task '+(full?'states':'updates')+' as of '+today+' (America/New_York):',...updates,
        'Apply only these saved updates. Preserve all other tasks, history, and schedules. IN PROGRESS | NONE clears the active marker. Return my full updated Today list.'
      ].join('\n');
    };
    const copyProgress=async(full=false)=>{
      const text=buildProgressText(full);
      if(!text){
        find('pt-copy-box').hidden=true;find('pt-copy-text').value='';
        const unsaved=[...new Set([...Object.keys(saved),...Object.keys(draft)])]
          .some(key=>Boolean(saved[key])!==Boolean(draft[key]));
        find('pt-status').textContent=unsaved?'Save Completed first, then copy progress':'No new saved changes to copy';
        return;
      }
      try{
        if(!navigator.clipboard)throw new Error('Clipboard unavailable');
        await navigator.clipboard.writeText(text);
        find('pt-copy-box').hidden=true;
        find('pt-status').textContent=full?'Full history copied · paste to sync or keep as a backup':'New changes copied · paste into this chat to sync';
      } catch(error){
        find('pt-copy-box').hidden=false;find('pt-copy-text').value=text;
        find('pt-copy-text').focus();find('pt-copy-text').select();
        find('pt-status').textContent=full?'Select and copy the full history below':'Select and copy the new changes below';
      }
    };
    find('pt-copy').addEventListener('click',()=>copyProgress(false));
    find('pt-copy-full').addEventListener('click',()=>copyProgress(true));
    window.TaskListBridge.attach({
      root,tasks,pairWith,children,groups,today,addDays,progressKey,occurrenceKey,childKey,
      subtaskCount,hasSubtasks,dueToday,overdue,onDate,isDone,isRecurring,renderToday,renderFuture,
      getState:()=>({version:2026103022,completed:{...saved},inProgress,progressStateInitialized,movedTo:{...movedTo},rolloverCompletedOn:{...rolloverCompletedOn},updatedAt:new Date().toISOString()}),
      setState:state=>{
        saved={...(state.completed||{})};draft={...saved};
        inProgress=typeof state.inProgress==='string'?state.inProgress:null;
        progressStateInitialized=state.progressStateInitialized===true;
        movedTo={...(state.movedTo||{})};rolloverCompletedOn={...(state.rolloverCompletedOn||{})};
      },
      moveOccurrence:(task,date,target)=>{
        const key=occurrenceId(task,date);movedTo[key]=target;delete rolloverCompletedOn[key];saveLocalState();
      }
    });
    renderToday();renderFuture();
    if(Object.keys(saved).some(k=>saved[k]))find('pt-status').textContent='Local progress restored · chat not synced';
  })();
  </script>
</div>
